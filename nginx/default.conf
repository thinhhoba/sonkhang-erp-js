# Sonkhang ERP — reverse proxy (HTTP; SSL placeholder bên dưới cho certbot)

upstream next_app {
  server app:3000;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 25M;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
  gzip_min_length 1024;

  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-XSS-Protection "1; mode=block" always;

  # Dự phòng tầng nginx: chặn route giả lập kể cả khi app chưa chặn
  location = /api/inventory/invoices/simulate-meinvoice {
    return 403 '{"error":"Endpoint mô phỏng bị vô hiệu hóa trên Production!"}';
  }
  location = /api/logistics/orders/simulate-sapo {
    return 403 '{"error":"Endpoint mô phỏng bị vô hiệu hóa trên Production!"}';
  }

  location / {
    proxy_pass http://next_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection upgrade;
  }
}

